server.port=8080

# ---------- MySQL (database "studybuddy" is auto-created) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/studybuddy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
